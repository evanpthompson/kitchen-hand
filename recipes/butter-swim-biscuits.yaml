id: butter-swim-biscuits
title: Butter Swim Biscuits
tags: [baking, breakfast]
servings: 6
mode: manual

source: "@thebuttababe on Instagram"

provenance:
  input_type: instagram
  source_url: "https://www.instagram.com/reel/DDLXTTQsaim/"
  creator: "@thebuttababe (Alex Bala)"
  captured_date: "2026-09-17"
  raw_capture_path: "inbox/butter-swim-biscuits/caption.txt"
  transcribed: false
  extraction_notes: >
    SERVINGS SET BY REVIEWER, AND THE NUMBER CARRIES A DECISION. The source
    states no yield — the slab is cut part-way through baking "depending on
    what size of biscuits you want", so the count is the cook's choice, not
    a property of the recipe. Evan set it to 6, which is what the creator
    made: a 6-cut gives biscuits sized for breakfast sandwiches. Cutting 9,
    as the corroborating capture in (1) does, gives smaller squares from the
    same dough. Both are correct; this draft records the sandwich-sized one,
    and the cut count in the "Cut the biscuits" phase follows from it.

    (1) **RESOLVED: the butter goes in the pan.** This was flagged as the
    draft's most consequential ambiguity — the source lists "½ c. Unsalted
    Butter melted" under Ingredients, which reads as a dough ingredient, but
    the method only ever puts it in the dish. Evan confirmed the pan reading:
    these are **butter swim biscuits**, where the dough is spread over melted
    butter in the pan and bakes sitting in it. Retitled from "Buttermilk Pan
    Biscuits" accordingly, since the technique is the name.

    Independently corroborated by another capture already in this inbox:
    inbox/ig-ameliaisnotachef-dagautcj-ca is a Maple Sausage Butter Swim
    Biscuit whose ingredient line reads "½ cup (1 stick) salted butter,
    sliced (for the pan)" — explicit about the destination — over the same
    base dough (2½ cups flour, 4 tsp baking powder, 2 cups buttermilk) at the
    same 450°F. That capture also scores its slab into 9 squares in a 9x9
    dish, which supports (5) below being a typo.

    Other issues:

    (2) **The title describes the intent, the method does not cover it.**
    The post is captioned "Bacon, egg and cheese biscuit" and the biscuits
    are deliberately cut sandwich-sized, so the fillings are the point rather
    than an afterthought — an earlier revision of this note had that wrong.
    But the method still only makes biscuits: the fillings appear once, in
    the last line, as "add your toppings like egg, bacon, sausage, cheese or
    anything that you like", with no quantities and no method. Titled as the
    biscuit recipe the steps actually describe, with the fillings recorded as
    an unquantified serving suggestion. Do not add bacon and egg quantities
    the source never gave.

    (3) **How the butter was read.** It is listed under Ingredients as "½ c. Unsalted Butter
    melted", which reads as a dough ingredient. The method never adds it to
    the dough — the dry ingredients are whisked, the buttermilk is mixed in,
    and then "Add your stick of butter to your 9x8 dish and melt it in the
    oven". So as written it is a pan ingredient, not a dough one. (½ cup is
    one stick, so the quantities agree; only the destination is in doubt.)
    Recorded as the method states, in the pan — now confirmed, see (1).

    (4) Oven temperature is 450°F, recorded as 232°C. Bake times are given
    and unambiguous: 10 minutes, cut, then a further 15-20 minutes. The
    second is kept as a range in the instruction and duration_sec is left off
    that phase rather than collapsing the range to one number.

    (5) The dish is specified as 9x8, which is an unusual size and may be a
    typo for 9x9 or 9x13. Recorded as written.

ingredients:
  - id: flour
    name: All-purpose flour
    quantity: 2 1/2 c.
    prep: sifting is optional per the source
  - id: buttermilk
    name: Buttermilk
    quantity: 2 c.
  - id: baking-powder
    name: Baking powder
    quantity: 4 tsp.
  - id: salt
    name: Salt
    quantity: 1 tsp.
  - id: sugar
    name: Granulated sugar
    quantity: 1 1/2 tbsp.
  - id: butter
    name: Unsalted butter
    quantity: 1/2 c.
    prep: >
      sliced or melted into the baking dish, not mixed into the dough — the
      dough is spread over it and swims in it as it bakes
  - id: toppings
    name: Toppings
    prep: >
      "egg, bacon, sausage, cheese or anything that you like" — the source
      gives no quantities or method for any of them

phases:
  - name: Heat the oven
    instruction: Preheat the oven to 450°F (232°C).
    temp_c: 232
  - name: Mix the dry ingredients
    instruction: >
      Add the flour, baking powder, salt and sugar to a bowl. Sifting the
      flour is optional. Whisk the dry ingredients together.
    add_ingredients: [flour, baking-powder, salt, sugar]
  - name: Add the buttermilk
    instruction: >
      Add the buttermilk and mix until everything is combined. Do not
      overmix.
    add_ingredients: [buttermilk]
  - name: Melt the butter in the dish
    instruction: >
      Put the butter in a 9x8 baking dish and melt it in the oven. Take the
      dish out just before the butter starts to bubble.
    add_ingredients: [butter]
    temp_c: 232
  - name: Spread the dough
    instruction: >
      Add the biscuit mix to the dish and use a rubber spatula to spread the
      dough all the way to the edges of the pan.
  - name: First bake
    instruction: Bake for 10 minutes.
    duration_sec: 600
    temp_c: 232
  - name: Cut the biscuits
    instruction: >
      At the 10-minute mark, use a knife to cut into the dough. The source
      leaves the size to you; cut 6 for biscuits big enough to build a
      breakfast sandwich on, which is what the creator made.
  - name: Finish baking
    instruction: >
      Bake for a further 15 to 20 minutes, until golden brown on top.
    temp_c: 232
  - name: Top and serve
    instruction: >
      Remove from the oven and add toppings — the source suggests egg, bacon,
      sausage or cheese, without quantities or method. At this size they are
      meant to be split and built into breakfast sandwiches.
    add_ingredients: [toppings]

notes: >
  Oven-baked, so no CJ-A9U preset applies and mode is manual. Out of scope
  for both hardware tracks: the open rig is an induction hob and a stirrer,
  and the CJ-A9U is a stir-fry vessel. Kept in the collection as a recipe to
  cook by hand.
