    quantity: 1.5 tsp
    prep: chicken seasoning
  - id: chicken-parsley-dried
    name: Parsley, dried
    quantity: 2 tsp
    prep: chicken seasoning
  - id: chicken-chilli-flakes
    name: Chilli flakes
    quantity: 1 tsp
    prep: chicken seasoning
  - id: chicken-garlic-powder
    name: Garlic powder
    quantity: 2 tsp
    prep: chicken seasoning
  - id: chicken-onion-powder
    name: Onion powder
    quantity: 2 tsp
    prep: chicken seasoning
  - id: chicken-paprika
    name: Paprika
    quantity: 2 tsp
    prep: chicken seasoning
  - id: olive-oil
    name: Olive oil
    quantity: 2 tsp
    prep: >
      listed under the chicken in the source but never placed in the method
