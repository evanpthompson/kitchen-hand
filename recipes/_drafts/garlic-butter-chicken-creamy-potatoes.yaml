phases:
  - name: Season the chicken
    instruction: >
      Cube the chicken breast and toss with the salt, dried parsley, chilli
      flakes, garlic powder, onion powder and paprika.
    add_ingredients:
      [
        chicken,
        chicken-salt,
        chicken-parsley-dried,
        chicken-chilli-flakes,
        chicken-garlic-powder,
        chicken-onion-powder,
        chicken-paprika,
      ]
  - name: Sear the chicken
    instruction: >
      Cook the chicken over medium-high heat for 6-8 minutes, until golden
      brown. The source gives no internal temperature.
    add_ingredients: [olive-oil, light-butter]
    heat_level: null
    temp_c: null
  - name: Finish the chicken off-heat
    instruction: >
      Lower the heat completely, then add the extra butter, the minced garlic
      and the fresh parsley. Mix for about 1 minute, then set aside.
    add_ingredients: [minced-garlic, fresh-parsley]
    duration_sec: 60
  - name: Air fry the potatoes
    instruction: >
      Toss the cubed potatoes with the salt, parsley, chilli flakes, garlic
      powder, onion powder and paprika, and optionally a little olive oil or
      cooking spray. Air fry until cooked through. No temperature or time is
      given — see extraction_notes.
    add_ingredients:
      [
        potatoes,
        potato-salt,
        potato-parsley,
        potato-chilli-flakes,
        potato-garlic-powder,
        potato-onion-powder,
        potato-paprika,
        potato-oil,
      ]
    heat_level: null
    temp_c: null
    notes: >
      The air fryer is the reviewer's, not the caption's. Temperature and
      time are still missing and need a cook to establish.
  - name: Make the cream sauce
    instruction: >
      With the pan on medium-low heat, add the evaporated milk and the garlic
      and herb cream cheese. Stir continuously for about 5 minutes, until it
      bubbles a little and thickens.
    add_ingredients: [evaporated-milk, cream-cheese]
    duration_sec: 300
  - name: Combine
    instruction: >
      Add the air-fried potatoes to the thickened sauce and stir. They are
      meant to sit in it and soak rather than just be coated. Serve with the
      chicken.

notes: >
  Meal-prep recipe: the source states it keeps and reheats, either in a pan
  on low heat for 4-5 minutes or microwaved for 5 minutes on a plate.

  mode is manual rather than a CJ-A9U preset because the chicken, the
  potatoes and the sauce are three separate tracks, and one of them is an air
  fryer — a second appliance neither hardware track covers.
