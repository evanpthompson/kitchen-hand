  - id: potato-onion-powder
    name: Onion powder
    quantity: 1 tsp
    prep: potato seasoning
  - id: potato-paprika
    name: Paprika
    quantity: 1 tsp
    prep: potato seasoning
  - id: potato-oil
    name: Olive oil or cooking spray
    prep: optional, quantity not given in source
