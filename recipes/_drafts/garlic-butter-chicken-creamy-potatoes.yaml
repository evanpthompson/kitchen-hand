  - id: chicken-onion-powder
    name: Onion powder
    quantity: 2 tsp
    prep: chicken seasoning
  - id: chicken-paprika
    name: Paprika
    quantity: 2 tsp
    prep: chicken seasoning
  - id: olive-oil
