id: garlic-butter-chicken-creamy-potatoes
title: Garlic Butter Chicken & Creamy Garlic Herb Potatoes
tags: [chicken, potatoes, meal-prep, high-protein, weeknight]
servings: 4
mode: manual

source: "@jalalsamfit on Instagram"

provenance:
  input_type: instagram
  source_url: "https://www.instagram.com/reel/C9ngIBVoyZP/"
  creator: "@jalalsamfit (Jalal)"
  captured_date: "2026-09-17"
  raw_capture_path: "inbox/garlic-butter-chicken-creamy-potatoes/caption.txt"
  transcribed: false
  extraction_notes: >
    Ingredient quantities are complete and unambiguous; the method is not.
    The caption gives an ingredient list plus a short "Important Cooking
    Notes" section rather than a full procedure, so several steps below are
    reconstructed from fragments and two are missing outright. Needs a human
    pass, ideally against the video, before promotion.

    (1) The potatoes are never actually cooked in the source. The notes jump
    from making the cream sauce to "then add the cooked potatoes in", with no
    method, temperature or time for cooking them anywhere in the caption. The
    potato phase below says only what the source says — that they are cut
    small and end up cooked — and deliberately does not guess roast vs. pan
    vs. boil, or a temperature. This is the single biggest gap.

    (2) The potato seasonings (salt, parsley, chilli flakes, garlic powder,
    onion powder, paprika, optional oil) are listed as ingredients but the
    caption never says when they go in. Placed with the potatoes on the
    assumption they season the potatoes themselves, which is what the
    grouping implies, but the source does not state it.

    (3) "25g Light Butter (For cooking + extra once cooked)" is one quantity
    covering two uses and the split is not given. Left as a single 25g entry
    rather than invented as two.

    (4) The 2 tsp olive oil is listed under the chicken but never appears in
    the notes. Placed at the start of the chicken sear as the only plausible
    point, flagged here rather than silently.

    (5) Chicken doneness is given as "6-8 mins" on medium-high "for it to get
    golden brown", with no internal temperature. Kept as a range.

    (6) Brands are named in the source (@saffron_alley chicken, Sainsbury's
    evaporated milk, Philadelphia cream cheese) and are preserved in prep
    fields as attribution, not as requirements.

    (7) Macros are stated (551 kcal, 51g protein, 43g carbs, 18g fat per
    serving of 4) but the schema has no field for them, so they are recorded
    here only.

ingredients:
