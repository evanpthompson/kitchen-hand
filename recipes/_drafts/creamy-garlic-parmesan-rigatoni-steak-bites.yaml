id: creamy-garlic-parmesan-rigatoni-steak-bites
title: Creamy Garlic Parmesan Rigatoni with Steak Bites
tags: [beef, pasta, cheese, sauce]
mode: manual

source: "@twelverecipes on Instagram"

provenance:
  input_type: instagram
  source_url: "https://www.instagram.com/p/DX7DsIRircJ/"
  creator: "@twelverecipes"
  captured_date: "2026-09-17"
  raw_capture_path: "inbox/creamy-garlic-parmesan-rigatoni-steak-bites/caption.txt"
  transcribed: false
  extraction_notes: >
    Complete: every ingredient quantified, a nine-step method, a total cooking
    time and a calorie figure. Nothing reconstructed.

    QUESTION FOR REVIEW: servings. As with the other @twelverecipes capture in
    this batch, calories are given "per serving" without ever saying how many
    servings there are.

    (1) "2 cups rigatoni pasta" is a volume for a dry pasta that is
    awkward to measure that way, and the source does not say whether it is
    dry or cooked. Recorded as written; dry is the reading that matches the
    method, which cooks it first.

    (2) The steak is "sirloin or ribeye", an either/or kept on the
    ingredient - they behave differently in a hot pan and the source is
    relaxed about which.

    (3) Salt and pepper are "to taste"; parsley and the extra parmesan for
    garnish have no quantities.

    (4) The steak is plated beside the pasta rather than tossed through it,
    which the source is explicit about. Kept, since it changes how the dish
    is served.

ingredients:
  - id: rigatoni
    name: Rigatoni
    quantity: 2 cups
    prep: dry - the source does not specify, but the method cooks it first
  - id: steak
    name: Steak
    quantity: 1 lb
    prep: sirloin or ribeye, cubed
  - id: cream
    name: Heavy cream
    quantity: 1 cup
  - id: parmesan
    name: Parmesan cheese
    quantity: 3/4 cup
    prep: grated
  - id: butter
    name: Butter
    quantity: 2 tbsp
  - id: olive-oil
    name: Olive oil
    quantity: 1 tbsp
  - id: garlic
    name: Garlic cloves
    quantity: "3"
    prep: minced
  - id: italian-seasoning
    name: Italian seasoning
    quantity: 1 tsp
  - id: paprika
    name: Paprika
    quantity: 1/2 tsp
  - id: seasoning
    name: Salt and pepper
    prep: to taste - quantity not given in source
  - id: parsley
    name: Fresh parsley
    prep: chopped, to garnish - quantity not given in source

phases:
  - name: Cook the rigatoni
    instruction: >
      Cook the rigatoni according to the package instructions, then drain.
    add_ingredients: [rigatoni]
  - name: Season and sear the steak
    instruction: >
      Season the steak cubes with salt, pepper, paprika and Italian seasoning.
      Heat the olive oil in a pan and sear the steak bites until browned and
      juicy, then set aside.
    add_ingredients: [steak, seasoning, paprika, italian-seasoning, olive-oil]
  - name: Garlic butter
    instruction: >
      In the same pan, melt the butter and saute the garlic until fragrant.
    add_ingredients: [butter, garlic]
  - name: Simmer the cream
    instruction: Add the heavy cream and let it simmer for 2-3 minutes.
    add_ingredients: [cream]
    duration_sec: 120
  - name: Melt the parmesan
    instruction: >
      Stir in the parmesan until the sauce becomes smooth and creamy.
    add_ingredients: [parmesan]
  - name: Toss the pasta
    instruction: Toss the cooked rigatoni in the sauce until fully coated.
  - name: Plate
    instruction: >
      Plate the creamy pasta and add the steak bites on the side rather than
      stirred through. Garnish with parsley and extra parmesan.
    add_ingredients: [parsley]

notes: >
  Stated cooking time 30 minutes, about 950 kcal per serving.

  Same sauce as creamy-garlic-chicken-cheesy-rice-skillet from the same
  creator - cream reduced, cheese melted in, no roux - with a different
  protein and starch. Two recipes, one sauce.
