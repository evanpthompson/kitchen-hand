id: buttermilk-pan-biscuits
title: Buttermilk Pan Biscuits
tags: [baking, breakfast]
mode: manual

source: "@thebuttababe on Instagram"

provenance:
  input_type: instagram
  source_url: "https://www.instagram.com/reel/DDLXTTQsaim/"
  creator: "@thebuttababe (Alex Bala)"
  captured_date: "2026-09-17"
  raw_capture_path: "inbox/buttermilk-pan-biscuits/caption.txt"
  transcribed: false
  extraction_notes: >
    **This draft is deliberately invalid: `servings` is absent because the
    source never states it.** The yield is "depending on what size of
    biscuits you want" — the dough is baked as a slab in a 9x8 dish and cut
    part-way through, so the count is chosen by the cook. A human needs to
    pick a number, or the schema needs a way to say "variable".

    Two substantive issues:

    (1) **The title is not the recipe.** The post is captioned "Bacon, egg
    and cheese biscuit", but the method makes biscuits only. The bacon, egg
    and cheese appear once, in the last line, as "add your toppings like egg,
    bacon, sausage, cheese or anything that you like" — no quantities, no
    method, and explicitly a list of options rather than a specification.
    Titled as the biscuit recipe it actually is, with the toppings recorded
    as an unquantified serving suggestion. Retitle if you disagree, but do
    not add bacon and egg quantities that the source never gave.

    (2) **The butter is ambiguous and the two readings give different
    biscuits.** It is listed under Ingredients as "½ c. Unsalted Butter
    melted", which reads as a dough ingredient. The method never adds it to
    the dough — the dry ingredients are whisked, the buttermilk is mixed in,
    and then "Add your stick of butter to your 9x8 dish and melt it in the
    oven". So as written it is a pan ingredient, not a dough one. (½ cup is
    one stick, so the quantities agree; only the destination is in doubt.)
    Recorded as the method states, in the pan, and flagged here. Check the
    video before promoting: butter in the pan makes a fried-bottom pan
    biscuit, butter in the dough makes something else entirely.

    (3) Oven temperature is 450°F, recorded as 232°C. Bake times are given
    and unambiguous: 10 minutes, cut, then a further 15-20 minutes. The
    second is kept as a range in the instruction and duration_sec is left off
    that phase rather than collapsing the range to one number.

    (4) The dish is specified as 9x8, which is an unusual size and may be a
    typo for 9x9 or 9x13. Recorded as written.

ingredients:
  - id: flour
    name: All-purpose flour
    quantity: 2 1/2 c.
    prep: sifting is optional per the source
  - id: buttermilk
    name: Buttermilk
    quantity: 2 c.
  - id: baking-powder
    name: Baking powder
    quantity: 4 tsp.
  - id: salt
    name: Salt
    quantity: 1 tsp.
  - id: sugar
    name: Granulated sugar
    quantity: 1 1/2 tbsp.
  - id: butter
    name: Unsalted butter
    quantity: 1/2 c.
    prep: >
      melted in the baking dish, not mixed into the dough — the source lists
      it as an ingredient but uses it in the pan, see extraction_notes
  - id: toppings
    name: Toppings
    prep: >
      "egg, bacon, sausage, cheese or anything that you like" — the source
      gives no quantities or method for any of them

phases:
  - name: Heat the oven
    instruction: Preheat the oven to 450°F (232°C).
    temp_c: 232
  - name: Mix the dry ingredients
    instruction: >
      Add the flour, baking powder, salt and sugar to a bowl. Sifting the
      flour is optional. Whisk the dry ingredients together.
    add_ingredients: [flour, baking-powder, salt, sugar]
  - name: Add the buttermilk
    instruction: >
      Add the buttermilk and mix until everything is combined. Do not
      overmix.
    add_ingredients: [buttermilk]
  - name: Melt the butter in the dish
    instruction: >
      Put the butter in a 9x8 baking dish and melt it in the oven. Take the
      dish out just before the butter starts to bubble.
    add_ingredients: [butter]
    temp_c: 232
  - name: Spread the dough
    instruction: >
      Add the biscuit mix to the dish and use a rubber spatula to spread the
      dough all the way to the edges of the pan.
  - name: First bake
    instruction: Bake for 10 minutes.
    duration_sec: 600
    temp_c: 232
  - name: Cut the biscuits
    instruction: >
      At the 10-minute mark, use a knife to cut into the dough, sized however
      large you want the biscuits.
  - name: Finish baking
    instruction: >
      Bake for a further 15 to 20 minutes, until golden brown on top.
    temp_c: 232
  - name: Top and serve
    instruction: >
      Remove from the oven and add toppings — the source suggests egg, bacon,
      sausage or cheese, without quantities or method.
    add_ingredients: [toppings]

notes: >
  Oven-baked, so no CJ-A9U preset applies and mode is manual. Out of scope
  for both hardware tracks: the open rig is an induction hob and a stirrer,
  and the CJ-A9U is a stir-fry vessel. Kept in the collection as a recipe to
  cook by hand.
