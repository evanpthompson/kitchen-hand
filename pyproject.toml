[project]
name = "kitchen-hand"
version = "0.1.0"
description = "Recipe collection and ingestion tooling for Kitchen Hand"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.26.0",
    "markitdown[youtube-transcription]>=0.1.6",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
transcribe = [
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
# service/ has its own pyproject and its own environment - fastapi is not in
# this one. Without this, root `uv run pytest` walks into service/tests/ and
# dies collecting it, which is the command CONTRIBUTING tells people to run.
# Run the service suite from service/.
testpaths = ["tests"]
